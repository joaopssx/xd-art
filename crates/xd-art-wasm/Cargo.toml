[package]
name = "xd-art-wasm"
description = "xd-art's engine for the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No threads, no GIF, no QOI: only what the page uses. Recipes need serde.
xd-art-core = { path = "../xd-art-core", default-features = false, features = ["serde"] }
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
