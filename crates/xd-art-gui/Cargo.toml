[package]
name = "xd-art-gui"
description = "Desktop interface for xd-art, built with GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "xd_art_gui"
path = "src/lib.rs"

[[bin]]
name = "xd-art"
path = "src/main.rs"

[dependencies]
xd-art-core = { path = "../xd-art-core" }
xd-art-text = { path = "../xd-art-text" }
gpui = "=0.2.2"
# Only for the frame type gpui draws images from; the same version gpui uses.
image = { version = "0.25.10", default-features = false }

[features]
# Import palettes from lospec.com in the export panel. Off by default.
online-palettes = ["xd-art-core/online-palettes"]

[lints]
workspace = true
