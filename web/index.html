<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xd-art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>xd-art</h1>
    <p>Images to pixel art, in your browser. Nothing is uploaded.</p>
  </header>

  <main>
    <section class="controls">
      <label class="file">
        <span>Image</span>
        <input id="file" type="file" accept="image/png,image/jpeg,image/bmp,.tga">
      </label>

      <label><span>Width</span><input id="width" type="number" min="1" max="1024" value="64"></label>
      <label><span>Height</span><input id="height" type="number" min="1" max="1024" value="64"></label>
      <label class="check"><input id="keep" type="checkbox" checked> keep the aspect ratio</label>
      <label><span>Sampling</span><select id="sample"></select></label>
      <label><span>Palette</span><select id="palette"></select></label>
      <label><span>Distance</span><select id="metric"></select></label>
      <label><span>Dithering</span><select id="dither"></select></label>
      <label><span>Amount</span><input id="amount" type="range" min="0" max="1" step="0.05" value="0.2"><output id="amount-value">0.2</output></label>
      <label><span>Export scale</span><input id="scale" type="number" min="1" max="16" value="1"></label>

      <a id="download" class="button" download="pixel-art.png" aria-disabled="true">Download PNG</a>
      <p id="status" role="status">Loading the engine...</p>
    </section>

    <section class="views">
      <figure>
        <img id="source" alt="the chosen image" hidden>
        <figcaption>source</figcaption>
      </figure>
      <figure>
        <img id="result" alt="the converted pixel art" hidden>
        <figcaption>result</figcaption>
      </figure>
    </section>
  </main>

  <footer><a href="https://github.com/joaopssx">github/joaopssx</a></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
