name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check

  # The gui crate pulls in gpui, which links against xcb and xkbcommon on Linux.
  # The runner image does not ship the -dev packages, so they are installed here.
  # The list comes from link errors seen while building on Ubuntu, see
  # docs/building.md.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system libraries for gpui
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # The engine without default features, as the browser build uses it, and the wasm
  # crate itself. See docs/web.md.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p xd-art-core --no-default-features --all-targets
      - run: cargo build -p xd-art-wasm --target wasm32-unknown-unknown --profile wasm

  # Compares a few whole conversions with crates/xd-art-bench/speed-budget.txt. Shared
  # runners vary a lot from run to run, so a slow result is reported but does not fail
  # the build; the budgets are about four times the development machine's times and
  # only catch a change that makes something several times slower. See the "Speed
  # check" section of docs/performance.md.
  speed:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo run --release -p xd-art-bench --example speed_check
