name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check

  # The gui crate pulls in gpui, which links against xcb and xkbcommon on Linux.
  # The runner image does not ship the -dev packages, so they are installed here.
  # The list comes from link errors seen while building on Ubuntu, see
  # docs/building.md.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: system libraries for gpui
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
